[project]
name = "expense-tracker-mcp-server"
version = "0.1.0"
description = "Production-grade multi-user Expense Tracker MCP Server"
readme = "README.md"
authors = [
    { name = "Debangi", email = "debangiofficial@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastmcp>=4.0.5",
    "python-dotenv>=1.2.3",
    "supabase>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
expense-tracker-mcp-server = "expense_tracker_mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
